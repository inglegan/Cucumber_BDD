name: Purchase Tests Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite ejecutarlo manualmente desde la interfaz de GitHub Actions

jobs:
  run-purchase-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas de compra con Behave
        run: |
          mkdir -p reports/allure-results
           # behave -f allure_behave.formatter:AllureFormatter -o reports/allure-results features/purchase.feature
           # behave --no-capture --no-capture-stderr -f allure_behave.formatter:AllureFormatter -o reports/allure-results features/purchase.feature
           behave -k --no-capture --no-capture-stderr -f allure_behave.formatter:AllureFormatter -o reports/allure-results features/purchase.feature

      - name: Generar Reporte Visual
        run: |
          python generar_reporte.py

      - name: Subir artefactos de reporte
        uses: actions/upload-artifact@v4
        with:
          name: purchase-test-reports
          path: |
            reports/reporte.html
            reports/allure-results/
        if: always()
